# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Idioma y Zona Horaria
lang: es # Cambiado a español
timezone: America/Bogota # Ajustado a tu zona (puedes cambiarlo si prefieres otra)

# jekyll-seo-tag settings
# ↓ --------------------------

title: Lexo0x00 # Nombre principal que sale en la barra lateral

tagline: Pentester & Red Teamer # El subtítulo que querías

description: >- 
  Writeups de máquinas de HackTheBox, Vulnlab y retos CTF. Documentando mi camino en ciberseguridad.

# URL de tu sitio (¡Importante para que carguen los estilos!)
url: "https://lexoday.github.io"

github:
  username: lexoday 

twitter:
  username: 

social:
  name: Lexo0x00 # Tu nombre de autor
  email: # Tu email si quieres que aparezca
  links:
    - https://github.com/lexoday
    # - https://twitter.com/tu_usuario

# ↑ --------------------------

# Tema oscuro por defecto (Crucial para el diseño de la imagen)
theme_mode: dark # Forzamos el modo oscuro

# Tu foto de perfil en la barra lateral
# Puedes usar tu foto de GitHub directamente:
avatar: https://github.com/lexoday.png

# Otras configuraciones visuales
toc: true # Índice en los posts
paginate: 10
baseurl: ""

# ------------ El resto se mantiene por defecto para que funcione el sistema ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" 
      type: posts
    values:
      layout: post
      comments: true 
      toc: true 
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs 
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

head_custom: |
  <link rel="stylesheet" href="/assets/css/custom.css">